<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio Photobooth</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Pacifico&family=Courier+Prime:wght@700&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
  
  <!-- Library QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="desktop-container">
    
    <!-- STEP 1: WELCOME SCREEN -->
    <div id="step-welcome" class="step-view center-layout">
      <div class="hero-card">
        <div class="brand-icon"><i class="fa-solid fa-camera-retro"></i></div>
        <h1>Photo Studio</h1>
        <p class="subtitle">Pilih jumlah foto dan mulai pemotretan</p>
        
        <div class="options-grid">
          <button class="opt-btn active" onclick="setPhotoCount(3, this)">3 Foto</button>
          <button class="opt-btn" onclick="setPhotoCount(4, this)">4 Foto</button>
        </div>
        
        <button id="start-btn" onclick="startCamera()">
          <i class="fa-solid fa-play"></i> Mulai Pemotretan
        </button>
      </div>
    </div>

    <!-- STEP 2: CAMERA SCREEN -->
    <div id="step-camera" class="step-view center-layout hidden">
      <div class="camera-card">
        <div class="card-header">
          <h2><i class="fa-solid fa-camera"></i> Kamera Live</h2>
          <button class="btn-secondary back-btn" onclick="resetToHome()">Batal</button>
        </div>

        <div class="camera-frame">
          <video id="webcam" autoplay playsinline></video>
          <div id="countdown-overlay" class="hidden">3</div>
        </div>

        <button id="snap-btn" onclick="startCaptureSequence()">
          <i class="fa-solid fa-aperture"></i> Ambil Foto
        </button>
      </div>
    </div>

    <!-- STEP 3: EDITOR SCREEN -->
    <div id="step-editor" class="step-view hidden">
      <div class="editor-layout">
        
        <!-- SIDEBAR CONTROLS -->
        <div class="sidebar-panel">
          <h2><i class="fa-solid fa-sliders"></i> Editor Photo</h2>

          <!-- Filter Foto -->
          <div class="control-box">
            <label><i class="fa-solid fa-wand-magic"></i> Filter Foto</label>
            <select id="filter-select" onchange="setPhotoFilter(this.value)" class="custom-select">
              <option value="none">Normal</option>
              <option value="bw">Hitam Putih (B&W)</option>
              <option value="sepia">Sepia Classic</option>
              <option value="vintage">Vintage Warm</option>
              <option value="bright">Bright & Soft</option>
              <option value="cyan">Cool Cyan</option>
            </select>
          </div>

          <!-- Color Background -->
          <div class="control-box">
            <label><i class="fa-solid fa-palette"></i> Warna Background</label>
            <div class="color-grid">
              <button class="color-circle active" style="background:#ffb6c1" onclick="setBgColor('#ffb6c1')"></button>
              <button class="color-circle" style="background:#90e0ef" onclick="setBgColor('#90e0ef')"></button>
              <button class="color-circle" style="background:#b7e4c7" onclick="setBgColor('#b7e4c7')"></button>
              <button class="color-circle" style="background:#ffffff; border: 1px solid #ddd" onclick="setBgColor('#ffffff')"></button>
              <button class="color-circle" style="background:#7c1d25" onclick="setBgColor('#7c1d25')"></button>

              <button class="color-circle" style="background:#18181b" onclick="setBgColor('#18181b')"></button>
              <button class="color-circle" style="background:#0f172a" onclick="setBgColor('#0f172a')"></button>
              <button class="color-circle" style="background:#283618" onclick="setBgColor('#283618')"></button>
              <button class="color-circle" style="background:#582f0e" onclick="setBgColor('#582f0e')"></button>
              <button class="color-circle" style="background:#ece145" onclick="setBgColor('#ece145')"></button>
            </div>
          </div>

          <!-- Motif Background -->
          <div class="control-box">
            <label><i class="fa-solid fa-wand-magic-sparkles"></i> Motif Background</label>
            <select id="template-select" onchange="setBgPattern(this.value)" class="custom-select">
              <option value="solid">Polos</option>
              <option value="polkadot">Polkadot</option>
              <option value="stripes">Garis-Garis (Stripes)</option>
              <option value="stars">Bintang-Bintang</option>
              <option value="vintage">Frame Vintage</option>
            </select>
          </div>

          <!-- Slider Ukuran Motif -->
          <div class="control-box">
            <label><i class="fa-solid fa-up-right-and-down-left-from-center"></i> Ukuran Motif</label>
            <input type="range" id="pattern-size-slider" min="15" max="60" value="30" oninput="renderPhotoStrip()">
          </div>

          <!-- Slider Ukuran Border -->
          <div class="control-box">
            <label><i class="fa-solid fa-maximize"></i> Ukuran Border</label>
            <input type="range" id="padding-slider" min="15" max="45" value="20" oninput="renderPhotoStrip()">
          </div>

          <!-- Teks Footer Kustom -->
            <div class="control-box">
              <label><i class="fa-solid fa-font"></i> Teks Footer</label>
              <input type="text" id="footer-text-input" placeholder="Tulis teks..." value="PHOTOSTUDIO MEMORIES" oninput="renderPhotoStrip()" class="custom-input">
              
              <div class="input-row" style="margin-top: 8px;">
                <select id="footer-font-select" onchange="renderPhotoStrip()" class="custom-select half">
                  <option value="Plus Jakarta Sans">Sans-Serif</option>
                  <option value="Pacifico">Cursive</option>
                  <option value="Courier Prime">Monospace</option>
                  <option value="Montserrat">Bold Caps</option>
                </select>
                <input type="color" id="footer-color-picker" value="#ffffff" onchange="renderPhotoStrip()" class="color-picker-input">
              </div>

              <!-- TAMBAHAN: Ukuran Teks Footer -->
              <div style="margin-top: 10px;">
                <label style="font-size: 0.75rem; margin-bottom: 4px;"><i class="fa-solid fa-text-height"></i> Ukuran Teks: <span id="font-size-val">18px</span></label>
                <input type="range" id="footer-size-slider" min="12" max="32" value="18" oninput="document.getElementById('font-size-val').innerText = this.value + 'px'; renderPhotoStrip();">
              </div>

              <div class="checkbox-row" style="margin-top: 10px;">
                <input type="checkbox" id="show-date-checkbox" checked onchange="renderPhotoStrip()">
                <label for="show-date-checkbox">Tampilkan Tanggal Otomatis</label>
              </div>
            </div>

          <!-- QR Code Download HP -->
          <div class="control-box">
            <label><i class="fa-solid fa-qrcode"></i> QR Code Download HP</label>
            <button id="qr-generate-btn" class="btn-secondary" style="width: 100%;" onclick="generatePhotoQR()">
              <i class="fa-solid fa-mobile-screen-button"></i> Buat QR Code
            </button>
            <p id="qr-status" style="font-size: 0.75rem; color: #94a3b8; margin-top: 6px; text-align: center; display: none;"></p>
          </div>

          <!-- Actions -->
          <div class="action-buttons">
            <a id="download-btn" class="btn-primary" href="#"><i class="fa-solid fa-download"></i> Unduh Foto Strip</a>
            <button class="btn-secondary" onclick="resetToHome()"><i class="fa-solid fa-rotate-left"></i> Foto Ulang</button>
          </div>
        </div>

        <!-- CANVAS PREVIEW -->
        <div class="canvas-panel">
          <div class="canvas-wrapper">
            <canvas id="strip-canvas"></canvas>
          </div>
        </div>

      </div>
    </div>

  </div>

  <!-- Container Temporer QR Code (Hidden) -->
  <div id="qrcode-temp-container" style="display: none;"></div>

  <script src="script.js"></script>
</body>
</html>
