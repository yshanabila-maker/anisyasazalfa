<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photobooth App</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Montserrat:wght@400;700&family=Pacifico&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app-container">

    <!-- STEP 1: WELCOME SCREEN -->
    <div id="step-welcome" class="step-view">
      <div class="welcome-card">
        <h1><i class="fa-solid fa-camera-retro"></i> PhotoStrip Studio</h1>
        <p>Pilih jumlah foto yang ingin kamu ambil:</p>

        <div class="photo-options">
          <button class="opt-btn" onclick="setPhotoCount(2, this)">2 Foto</button>
          <button class="opt-btn active" onclick="setPhotoCount(3, this)">3 Foto</button>
          <button class="opt-btn" onclick="setPhotoCount(4, this)">4 Foto</button>
        </div>

        <button class="primary-btn" onclick="startCamera()">
          <i class="fa-solid fa-video"></i> Mulai Kamera
        </button>
      </div>
    </div>

    <!-- STEP 2: WEBCAM SCREEN -->
    <div id="step-camera" class="step-view hidden">
      <div class="camera-card">
        <div class="webcam-wrapper">
          <video id="webcam" autoplay playsinline></video>
          <div id="countdown-overlay" class="hidden">3</div>
        </div>

        <div class="camera-actions">
          <button class="secondary-btn" onclick="resetToHome()">Batal</button>
          <button id="snap-btn" class="primary-btn" onclick="startCaptureSequence()">
            <i class="fa-solid fa-camera"></i> Ambil Foto
          </button>
        </div>
      </div>
    </div>

    <!-- STEP 3: EDITOR SCREEN -->
    <div id="step-editor" class="step-view hidden">
      <div class="editor-layout">

        <!-- Control Sidebar -->
        <div class="editor-sidebar">
          <h2><i class="fa-solid fa-sliders"></i> Desain Photostrip</h2>

          <!-- Warna Background -->
          <div class="control-box">
            <label><i class="fa-solid fa-palette"></i> Warna Background</label>
            <div class="color-palette">
              <button class="color-circle" style="background:#ffb6c1" onclick="setBgColor('#ffb6c1')"></button>
              <button class="color-circle active" style="background:#800020" onclick="setBgColor('#800020')"></button>
              <button class="color-circle" style="background:#111827" onclick="setBgColor('#111827')"></button>
              <button class="color-circle" style="background:#fef08a" onclick="setBgColor('#fef08a')"></button>
              <button class="color-circle" style="background:#bbf7d0" onclick="setBgColor('#bbf7d0')"></button>
            </div>
          </div>

          <!-- Motif Background -->
          <div class="control-box">
            <label><i class="fa-solid fa-shapes"></i> Motif Background</label>
            <select id="pattern-select" onchange="setBgPattern(this.value)" class="custom-select">
              <option value="solid">Polos (Solid)</option>
              <option value="polkadot">Polkadot</option>
              <option value="stripes">Garis-Garis</option>
              <option value="stars">Bintang</option>
              <option value="vintage">Bingkai Vintage</option>
            </select>

            <div style="margin-top: 10px;">
              <label style="font-size: 0.75rem; margin-bottom: 4px;">Ukuran Motif</label>
              <input type="range" id="pattern-size-slider" min="15" max="60" value="30" oninput="renderPhotoStrip()">
            </div>
          </div>

          <!-- Filter Foto -->
          <div class="control-box">
            <label><i class="fa-solid fa-wand-magic-sparkles"></i> Filter Foto</label>
            <select id="filter-select" onchange="setPhotoFilter(this.value)" class="custom-select">
              <option value="none">Normal</option>
              <option value="bw">Hitam Putih (B&W)</option>
              <option value="sepia">Sepia Warm</option>
              <option value="vintage">Vintage Film</option>
              <option value="bright">Bright & Soft</option>
              <option value="cyan">Cool Cyan</option>
            </select>
          </div>

          <!-- Ukuran Border/Padding -->
          <div class="control-box">
            <label><i class="fa-solid fa-expand"></i> Ukuran Border</label>
            <input type="range" id="padding-slider" min="10" max="40" value="20" oninput="renderPhotoStrip()">
          </div>

          <!-- Teks Footer Kustom -->
          <div class="control-box">
            <label><i class="fa-solid fa-font"></i> Teks Footer</label>
            <input type="text" id="footer-text-input" placeholder="Tulis teks..." value="PHOTOSTUDIO MEMORIES" oninput="renderPhotoStrip()" class="custom-input">
            
            <div class="input-row" style="margin-top: 8px;">
              <select id="footer-font-select" onchange="renderPhotoStrip()" class="custom-select half">
                <option value="Plus Jakarta Sans">Sans-Serif</option>
                <option value="Pacifico">Cursive</option>
                <option value="Courier Prime">Monospace</option>
                <option value="Montserrat">Bold Caps</option>
              </select>
              <input type="color" id="footer-color-picker" value="#ffffff" onchange="renderPhotoStrip()" class="color-picker-input">
            </div>

            <!-- Ukuran Teks Footer -->
            <div style="margin-top: 10px;">
              <label style="font-size: 0.75rem; margin-bottom: 4px;"><i class="fa-solid fa-text-height"></i> Ukuran Teks: <span id="font-size-val">18px</span></label>
              <input type="range" id="footer-size-slider" min="12" max="32" value="18" oninput="document.getElementById('font-size-val').innerText = this.value + 'px'; renderPhotoStrip();">
            </div>

            <div class="checkbox-row" style="margin-top: 10px;">
              <input type="checkbox" id="show-date-checkbox" checked onchange="renderPhotoStrip()">
              <label for="show-date-checkbox">Tampilkan Tanggal Otomatis</label>
            </div>
          </div>

          <!-- Action Buttons -->
          <div class="editor-actions">
            <a id="download-btn" class="primary-btn full-width" href="#">
              <i class="fa-solid fa-download"></i> Unduh Foto
            </a>
            <button class="secondary-btn full-width" onclick="resetToHome()" style="margin-top: 8px;">
              <i class="fa-solid fa-rotate-left"></i> Foto Ulang
            </button>
          </div>
        </div>

        <!-- Canvas Preview Area -->
        <div class="canvas-preview-container">
          <canvas id="strip-canvas"></canvas>
        </div>

      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
